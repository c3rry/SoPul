[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse2026"
version = "0.1.0"
description = "Multi-Modal Quantitative Election Forecasting & Arbitrage Engine for 2026 U.S. Midterms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "yt-dlp>=2024.3.10",
    "faster-whisper>=1.0.1",
    "feedparser>=6.0.11",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "asyncpraw>=7.7.1",
    "rich>=13.7.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "config*", "db*", "features*", "forecasting*", "ingestion*", "nlp*"]
exclude = ["tests*", "docs*", "_agents*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
