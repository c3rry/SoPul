version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse2026_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse2026}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulse2026}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
